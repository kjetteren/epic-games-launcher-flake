name: Update launcher

on:
  schedule:
    - cron: "23 4 * * *" # daily at 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write

# Shared with update-nixpkgs.yml: runs of either workflow, manual or scheduled,
# wait for each other instead of racing to the push
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Epic's current build
        id: update
        run: |
          nix run .#update
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(sed -nE 's/^ *version = "([^"]+)";$/\1/p' package.nix)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the updated package
        if: steps.update.outputs.changed == 'true'
        run: nix build .# -L

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "epic-games-launcher: $VERSION"
          git push
